{{- if .Values.machineLearning.enabled }}
{{- $fullName := include "immich.fullname" . }}
{{- $cache := .Values.machineLearning.modelCache }}
{{- if and (eq $cache.type "persistentVolumeClaim") (not $cache.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullName }}-model-cache
  labels:
    {{- include "immich.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml $cache.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ $cache.size }}
  {{- with $cache.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-machine-learning
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    app.kubernetes.io/component: machine-learning
spec:
  {{- if not .Values.machineLearning.autoscaling.enabled }}
  replicas: {{ .Values.machineLearning.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "immich.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: machine-learning
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "immich.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: machine-learning
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "immich.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: machine-learning
          image: {{ include "immich.machineLearningImage" . | quote }}
          imagePullPolicy: {{ .Values.machineLearning.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.machineLearning.service.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          env:
            {{- with .Values.machineLearning.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: model-cache
              mountPath: "/cache"
          resources:
            {{- toYaml .Values.machineLearning.resources | nindent 12 }}
      volumes:
        - name: model-cache
          {{- if eq $cache.type "persistentVolumeClaim" }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-model-cache" $fullName) $cache.existingClaim }}
          {{- else if eq $cache.type "emptyDir" }}
          emptyDir: {}
          {{- else }}
          {{- fail "machineLearning.modelCache.type must be emptyDir or persistentVolumeClaim" }}
          {{- end }}
      {{- with .Values.machineLearning.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.machineLearning.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.machineLearning.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-machine-learning
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    app.kubernetes.io/component: machine-learning
  {{- with .Values.machineLearning.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.machineLearning.service.type }}
  ports:
    - name: http
      port: {{ .Values.machineLearning.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "immich.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: machine-learning
{{- end }}
