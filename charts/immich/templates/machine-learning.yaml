{{- if .Values.machineLearning.enabled }}
{{- $fullName := include "immich.fullname" . }}
{{- $cache := .Values.machineLearning.modelCache }}
{{- if and (eq $cache.type "persistentVolumeClaim") (not $cache.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullName }}-model-cache
  labels:
    {{- include "immich.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml $cache.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ $cache.size }}
  {{- with $cache.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-machine-learning
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    app.kubernetes.io/component: machine-learning
spec:
  {{- if not .Values.machineLearning.autoscaling.enabled }}
  replicas: {{ .Values.machineLearning.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "immich.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: machine-learning
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "immich.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: machine-learning
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "immich.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: machine-learning
          image: {{ include "immich.machineLearningImage" . | quote }}
          imagePullPolicy: {{ .Values.machineLearning.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.machineLearning.service.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          env:
            {{- with .Values.machineLearning.config }}
            {{- with .models }}
            {{- with .ttl }}
            - name: MACHINE_LEARNING_MODEL_TTL
              value: {{ . }}
            {{- end }}
            {{- with .ttlPollS }}
            - name: MACHINE_LEARNING_MODEL_TTL_POLL_S
              value: {{ . }}
            {{- end }}
            {{- with .interOpThreads }}
            - name: MACHINE_LEARNING_MODEL_INTER_OP_THREADS
              value: {{ . }}
            {{- end }}
            {{- with .intraOpThreads }}
            - name: MACHINE_LEARNING_MODEL_INTRA_OP_THREADS
              value: {{ . }}
            {{- end }}
            {{- with .clip }}
            {{- with .textual }}
            - name: MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL
              value: {{ . }}
            {{- end }}
            {{- with .visual }}
            - name: MACHINE_LEARNING_PRELOAD__CLIP__VISUAL
              value: {{ . }}
            {{- end }}
            {{- end }}
            {{- with .facial }}
            {{- with .recognition }}
            - name: MACHINE_LEARNING_PRELOAD__FACIAL_RECOGNITION__RECOGNITION
              value: {{ . }}
            {{- end }}
            {{- with .detection }}
            - name: MACHINE_LEARNING_PRELOAD__FACIAL_RECOGNITION__DETECTION
              value: {{ . }}
            {{- end }}
            {{- with .maxBatchSize }}
            - name: MACHINE_LEARNING_MAX_BATCH_SIZE__FACIAL_RECOGNITION
              value: {{ . }}
            {{- end }}
            {{- end }}
            {{- with .ocr }}
            {{- with .recognition }}
            - name: MACHINE_LEARNING_PRELOAD__OCR__RECOGNITION
              value: {{ . }}
            {{- end }}
            {{- with .detection }}
            - name: MACHINE_LEARNING_PRELOAD__OCR__DETECTION
              value: {{ . }}
            {{- end }}
            {{- with .maxBatchSize }}
            - name: MACHINE_LEARNING_MAX_BATCH_SIZE__OCR
              value: {{ . }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- with .workers }}
            - name: MACHINE_LEARNING_WORKERS
              value: {{ .workers }}
            {{- end }}

            {{- with .httpKeepaliveTimeoutS }}
            - name: MACHINE_LEARNING_HTTP_KEEPALIVE_TIMEOUT_S
              value: {{ .httpKeepaliveTimeoutS }}
            {{- end }}
            {{- with .workerTimeout }}
            - name: MACHINE_LEARNING_WORKER_TIMEOUT
              value: {{ . }}
            {{- end }}

            {{- with .ann }}
            {{- with .enabled }}
            - name: MACHINE_LEARNING_ANN
              value: {{ . }}
            {{- end }}
            {{- with .fp16Turbo }}
            - name: MACHINE_LEARNING_ANN_FP16_TURBO
              value: {{ . }}
            {{- end }}
            {{- with .tuningLevel }}
            - name: MACHINE_LEARNING_ANN_TUNING_LEVEL
              value: {{ . }}
            {{- end }}
            {{- end }}

            {{- with .deviceIds }}
            - name: MACHINE_LEARNING_DEVICE_IDS
              value: {{ . }}
            {{- end }}

            {{- with .rknn }}
            {{- with .enabled }}
            - name: MACHINE_LEARNING_RKNN
              value: {{ . }}
            {{- end }}
            {{- with .threads }}
            - name: MACHINE_LEARNING_RKNN_THREADS
              value: {{ . }}
            {{- end }}
            {{- end }}

            {{- with .modelArena }}
            - name: MACHINE_LEARNING_MODEL_ARENA
              value: {{ . }}
            {{- end }}

            {{- with .openvinoPrecision }}
            - name: MACHINE_LEARNING_OPENVINO_PRECISION
              value: {{ .Values.machineLearning.config.openvinoPrecision }}
            {{- end }}

            - name: MACHINE_LEARNING_CACHE_FOLDER
              value: {{ .cacheFolder | default "/cache" | quote }}

            {{- with .Values.machineLearning.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: model-cache
              mountPath: {{ .Values.machineLearning.config.cacheFolder | default "/cache" | quote }}
          resources:
            {{- toYaml .Values.machineLearning.resources | nindent 12 }}
      volumes:
        - name: model-cache
          {{- if eq $cache.type "persistentVolumeClaim" }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-model-cache" $fullName) $cache.existingClaim }}
          {{- else if eq $cache.type "emptyDir" }}
          emptyDir: {}
          {{- else }}
          {{- fail "machineLearning.modelCache.type must be emptyDir or persistentVolumeClaim" }}
          {{- end }}
      {{- with .Values.machineLearning.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.machineLearning.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.machineLearning.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-machine-learning
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    app.kubernetes.io/component: machine-learning
  {{- with .Values.machineLearning.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.machineLearning.service.type }}
  ports:
    - name: http
      port: {{ .Values.machineLearning.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "immich.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: machine-learning
{{- end }}
