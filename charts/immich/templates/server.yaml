{{- $fullName := include "immich.fullname" . }}
{{- range $role := list "api" "microservices" }}
{{- $config := index $.Values.server $role }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-{{ $role }}
  labels:
    {{- include "immich.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  {{- if not $config.autoscaling.enabled }}
  replicas: {{ $config.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "immich.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $role }}
  template:
    metadata:
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "immich.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $role }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "immich.serviceAccountName" $ }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: immich-server
          image: {{ include "immich.serverImage" $ | quote }}
          imagePullPolicy: {{ $.Values.server.image.pullPolicy }}
          env:
            {{- include "immich.serverEnv" $ | nindent 12 }}
            - name: IMMICH_WORKERS_{{ if eq $role "api" }}INCLUDE{{ else }}EXCLUDE{{ end }}
              value: api
          {{- if eq $role "api" }}
          ports:
            - name: http
              containerPort: {{ $config.service.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          {{- end }}
          {{- if $.Values.server.persistence.enabled }}
          volumeMounts:
            - name: media
              mountPath: {{ $.Values.server.persistence.mountPath }}
          {{- end }}
          resources:
            {{- toYaml $config.resources | nindent 12 }}
      {{- if $.Values.server.persistence.enabled }}
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "immich.mediaClaim" $ }}
      {{- end }}
      {{- with $config.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-api
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.server.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.server.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.server.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "immich.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
