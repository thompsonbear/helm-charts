# PostgreSQL and Redis are external dependencies; this chart deliberately does
# not create either service.
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
serviceAccount:
  create: true
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}

server:
  # Settings shared by the API and microservices server deployments.
  image:
    repository: ghcr.io/immich-app/immich-server
    pullPolicy: IfNotPresent
    # Defaults to Chart.appVersion when empty.
    tag: ""
  timezone: Etc/UTC
  logLevel: log
  trustedProxies: []
  # Additional environment variables for both server deployments.
  extraEnv: []
  api:
    replicaCount: 1
    service:
      type: ClusterIP
      port: 2283
      annotations: {}
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: ""
      behavior: {}
  microservices:
    replicaCount: 1
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: ""
      behavior: {}
  # Both server roles must see the same media files.
  persistence:
    enabled: true
    existingClaim: ""
    size: 10Gi
    storageClass: ""
    accessModes: [ReadWriteMany]
    mountPath: /data

# Expose only the API Service. At most one of ingress or httpRoute can be
# enabled for a release.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  # Gateway API parentRefs, for example:
  # - name: public-gateway
  #   namespace: gateway-system
  #   sectionName: https
  parentRefs: []
  # Empty accepts all hostnames attached to the selected Gateway listener.
  hostnames: []
  # Requests are forwarded to the API Service. Override the default match when
  # a more specific Gateway API route is required.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# An already-running PostgreSQL instance. Credentials are read from an existing
# Secret; secretType selects whether it contains a complete URL or a password.
database:
  host: postgresql.default.svc.cluster.local
  port: 5432
  name: immich
  username: immich
  existingSecret: immich-database
  # -- Secret content format: url reads DB_URL from urlKey; basic reads the
  # password from passwordKey and uses the individual connection fields.
  secretType: url
  passwordKey: password
  urlKey: jdbc-uri
  sslMode: ""
  # Empty enables Immich's extension auto-detection.
  vectorExtension: ""

# An already-running Redis instance. Its password is optional.
redis:
  host: redis.default.svc.cluster.local
  port: 6379
  username: ""
  database: 0
  existingSecret: ""
  passwordKey: password

machineLearning:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/immich-app/immich-machine-learning
    pullPolicy: IfNotPresent
    # Defaults to Chart.appVersion when empty.
    tag: ""
  service:
    type: ClusterIP
    port: 3003
    annotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""
    behavior: {}
  modelCache:
    # emptyDir or persistentVolumeClaim
    type: emptyDir
    existingClaim: ""
    size: 10Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
