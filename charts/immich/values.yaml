# PostgreSQL and Redis are external dependencies; this chart deliberately does
# not create either service.
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
serviceAccount:
  create: true
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}

server:
  # Settings shared by the API and microservices server deployments.
  image:
    repository: ghcr.io/immich-app/immich-server
    pullPolicy: IfNotPresent
    # Defaults to Chart.appVersion when empty.
    tag: ""
  timezone: Etc/UTC
  logLevel: log
  trustedProxies: []
  # Additional environment variables for both server deployments.
  extraEnv: []
  api:
    replicaCount: 1
    service:
      type: ClusterIP
      port: 2283
      annotations: {}
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: ""
      behavior: {}
  microservices:
    replicaCount: 1
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: ""
      behavior: {}
  persistence:
    enabled: true
    existingClaim: ""
    size: 10Gi
    # storageClass/pvc must support RWX/ReadWriteMany access mode
    storageClass: ""

machineLearning:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/immich-app/immich-machine-learning
    pullPolicy: IfNotPresent
    # Defaults to Chart.appVersion when empty.
    tag: ""
  service:
    type: ClusterIP
    port: 3003
    annotations: {}
  config: {}
    # # https://docs.immich.app/install/environment-variables#machine-learning
    # models:
    #   ttl: 300
    #   ttlPollS: 10
    #   interOpThreads: 1
    #   intraOpThreads: 2
    #   clip:
    #     textual: ""
    #     visual: ""
    #   facial:
    #     recognition: ""
    #     detection: ""
    #     maxBatchSize: ~
    #   ocr:
    #     recognition: ""
    #     detection: ""
    #     maxBatchSize: 6
    # cacheFolder: "/cache"
    # requestThreads: ~
    # workers: 1
    # httpKeepaliveTimeoutS: 2
    # workerTimeout: 300
    # ann:
    #   enabled: true
    #   fp16Turbo: false
    #   tuningLevel: 2
    # deviceIds: 0
    # rknn:
    #   enabled: true
    #   threads: 1
    # modelArena: true
    # openvinoPrecision: "FP32"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""
    behavior: {}
  modelCache:
    # emptyDir or persistentVolumeClaim
    type: emptyDir
    existingClaim: ""
    size: 10Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]

# ingress for the API Service. At most one of ingress or httpRoute can be
# enabled for a release.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
